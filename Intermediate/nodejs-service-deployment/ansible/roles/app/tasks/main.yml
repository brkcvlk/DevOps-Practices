- name: Install Python3, pip, git and nginx
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - git
      - nginx
    state: present

- name: Clone the repository
  ansible.builtin.git:
    repo: "https://github.com/brkcvlk/DevOps-Practices.git"
    dest: /opt/app
    version: main
    force: yes

- name: Set ownership of app directory
  ansible.builtin.file:
    path: /opt/app
    owner: ec2-user
    group: ec2-user
    recurse: yes

- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: /opt/app/Intermediate/nodejs-service-deployment/app/requirements.txt
    executable: pip3

- name: Remove nginx default server block
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: 'include /etc/nginx/default.d'
    state: absent
  notify: restart nginx

- name: Copy systemd service file
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-app.service
    content: |
      [Unit]
      Description=FastAPI Hello World App
      After=network.target

      [Service]
      User=ec2-user
      WorkingDirectory=/opt/app/Intermediate/nodejs-service-deployment/app
      ExecStart=/usr/local/bin/uvicorn app:app --host 127.0.0.1 --port 8000
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Configure nginx as reverse proxy
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/fastapi-app.conf
    content: |
      server {
          listen 80;
          server_name _;

          location / {
              proxy_pass http://127.0.0.1:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start fastapi-app service
  ansible.builtin.systemd:
    name: fastapi-app
    enabled: yes
    state: restarted

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: restarted