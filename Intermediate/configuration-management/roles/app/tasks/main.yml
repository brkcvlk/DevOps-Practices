- name: Create app directory
  ansible.builtin.file:
    path: /var/www/app
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Upload and extract app tarball
  ansible.builtin.unarchive:
    src: "{{ app_tarball }}"
    dest: /var/www/app
    owner: ec2-user
    group: ec2-user